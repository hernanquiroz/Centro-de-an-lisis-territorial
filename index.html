<script>
(()=>{
const CFG=Object.assign({speed:1,rate:1},window.__CFG__||{});
const R=Math.random, ROWH=24;

/* ---------- Geografía aproximada (lon, lat) ---------- */
const COL_POLY=[[-77.35,8.67],[-76.9,8.1],[-76.0,9.0],[-75.6,10.0],[-75.2,10.7],[-74.4,11.1],[-73.4,11.3],[-72.4,11.9],[-71.3,12.4],[-71.9,11.6],[-72.7,11.1],[-72.5,10.4],[-72.9,9.6],[-72.4,8.9],[-72.5,8.2],[-72.0,7.6],[-71.9,7.0],[-70.9,7.0],[-70.0,6.9],[-69.4,6.1],[-67.8,6.2],[-67.4,5.4],[-67.6,4.5],[-67.8,3.2],[-67.3,2.0],[-67.1,1.2],[-68.2,1.8],[-69.4,1.1],[-69.9,0.6],[-70.0,-0.2],[-69.4,-1.0],[-69.9,-2.0],[-69.9,-4.2],[-70.8,-3.8],[-71.7,-2.2],[-72.8,-2.4],[-73.6,-1.8],[-74.8,-1.0],[-75.5,-0.2],[-76.4,0.3],[-77.4,0.4],[-78.0,1.0],[-78.8,1.5],[-78.5,2.4],[-77.9,2.7],[-77.1,3.9],[-77.4,4.8],[-77.5,6.0],[-77.8,7.1]];

const COL_PTS=[["Bogotá",-74.07,4.71,8000,1],["Medellín",-75.57,6.25,2600,1],["Cali",-76.53,3.45,2300,1],["Barranquilla",-74.78,10.96,1300,1],["Cartagena",-75.5,10.39,1000],["Bucaramanga",-73.12,7.12,600],["Cúcuta",-72.5,7.89,700],["Pasto",-77.28,1.21,400],["Leticia",-69.94,-4.21,50],["Santa Marta",-74.2,11.24,500],["Villavicencio",-73.63,4.14,550],["Pereira",-75.69,4.81,480],["Manizales",-75.52,5.07,450],["Ibagué",-75.23,4.44,540],["Neiva",-75.28,2.93,360],["Quibdó",-76.66,5.69,130],["Montería",-75.88,8.75,500],["Popayán",-76.61,2.44,320],["Valledupar",-73.25,10.47,530],["Arauca",-70.76,7.09,90],["Yopal",-72.4,5.34,150],["Florencia",-75.61,1.61,170],["Mocoa",-76.65,1.15,45],["Mitú",-70.26,1.25,30]].map(mk);

/* ---------- Mapa holográfico ---------- */
class MapView{
  constructor(cv,poly,pts,rgb,extra){
    this.cv=cv;this.ctx=cv.getContext('2d');this.poly=poly;this.pts=pts;this.rgb=rgb;this.extra=extra||[];
    this.pulse={};this.grid=[];this.W=0;this.H=0;
    const lo=poly.map(p=>p[0]),la=poly.map(p=>p[1]);
    this.b={x0:Math.min(...lo),x1:Math.max(...lo),y0:Math.min(...la),y1:Math.max(...la)};
    new ResizeObserver(()=>this.resize()).observe(cv.parentElement);this.resize();
  }
  resize(){
    const p=this.cv.parentElement,d=devicePixelRatio||1;
    this.W=p.clientWidth;this.H=p.clientHeight;if(!this.W||!this.H)return;
    this.cv.width=this.W*d;this.cv.height=this.H*d;this.ctx.setTransform(d,0,0,d,0,0);
    const b=this.b,k=Math.cos((b.y0+b.y1)/2*Math.PI/180),pad=22,w=(b.x1-b.x0)*k,h=b.y1-b.y0;
    this.k=k;this.s=Math.min((this.W-2*pad)/w,(this.H-2*pad)/h);
    this.ox=(this.W-w*this.s)/2;this.oy=(this.H-h*this.s)/2;
    const px=this.poly.map(q=>this.xy(q[0],q[1])),step=this.W>500?11:9;this.grid=[];
    for(let x=0;x<this.W;x+=step)for(let y=0;y<this.H;y+=step)if(inside(px,x,y))this.grid.push({x,y,e:0});
  }
  xy(lon,lat){return [this.ox+(lon-this.b.x0)*this.k*this.s,this.oy+(this.b.y1-lat)*this.s]}
  path(poly){const c=this.ctx;c.beginPath();poly.forEach((p,i)=>{const[x,y]=this.xy(p[0],p[1]);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}
  draw(t){
    const c=this.ctx,W=this.W,H=this.H,rgb=this.rgb;if(!W)return;
    c.clearRect(0,0,W,H);
    c.strokeStyle=`rgba(${rgb},.06)`;c.lineWidth=1;c.beginPath();
    for(let x=0;x<W;x+=40){c.moveTo(x,0);c.lineTo(x,H)}for(let y=0;y<H;y+=40){c.moveTo(0,y);c.lineTo(W,y)}c.stroke();
    this.path(this.poly);c.fillStyle=`rgba(${rgb},.07)`;c.fill();
    const scan=((t*0.00008)%1.3-.15)*H,g=this.grid,n=Math.ceil(g.length*.006*CFG.rate);
    for(let i=0;i<n;i++)g[Math.floor(R()*g.length)].e=1;
    for(const q of g){
      q.e*=.94;const dy=Math.abs(q.y-scan);
      const a=.1+.85*q.e+(dy<20?.45*(1-dy/20):0);
      c.fillStyle=`rgba(${rgb},${a.toFixed(2)})`;c.fillRect(q.x-1,q.y-1,2,2);
    }
    for(const e of this.extra){
      this.path(e.poly);c.fillStyle=`rgba(${e.rgb},.22)`;c.fill();
      c.save();c.shadowColor=`rgb(${e.rgb})`;c.shadowBlur=10;c.strokeStyle=`rgba(${e.rgb},.95)`;c.lineWidth=1.3;c.stroke();c.restore();
    }
    c.save();this.path(this.poly);c.shadowColor=`rgb(${rgb})`;c.shadowBlur=14;c.strokeStyle=`rgba(${rgb},.95)`;c.lineWidth=1.6;c.stroke();c.restore();
    const gr=c.createLinearGradient(0,scan-16,0,scan+16);
    gr.addColorStop(0,`rgba(${rgb},0)`);gr.addColorStop(.5,`rgba(${rgb},.22)`);gr.addColorStop(1,`rgba(${rgb},0)`);
    c.fillStyle=gr;c.fillRect(0,scan-16,W,32);
    c.font='10px ui-monospace,Menlo,Consolas,monospace';
    for(const p of this.pts){
      const[x,y]=this.xy(p.lon,p.lat),e=this.pulse[p.n]||0;
      c.fillStyle=`rgba(${rgb},.95)`;c.beginPath();c.arc(x,y,p.lab?2.8:1.9,0,7);c.fill();
      if(e>.03){c.strokeStyle=`rgba(${rgb},${e.toFixed(2)})`;c.lineWidth=1.3;c.beginPath();c.arc(x,y,3+(1-e)*18,0,7);c.stroke();this.pulse[p.n]=e*.95}
      if(p.lab){c.fillStyle=`rgba(${rgb},.85)`;c.fillText(p.n,x+6,y-5)}
    }
    for(const e of this.extra)if(e.label){const[x,y]=this.xy(e.lon,e.lat);c.fillStyle=`rgba(${e.rgb},.95)`;c.fillText(e.label,x-22,y-12)}
  }
}
function inside(poly,x,y){let r=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r}return r}

/* ---------- Hoja de cálculo animada ---------- */
const f1=v=>v.toFixed(1),f2=v=>v.toFixed(2),fi=v=>Math.round(v).toLocaleString('es-CO'),fs=v=>v;
const SPEC_ANT={
  cols:["Municipio","Pobl. (mil)","MWh","Temp °C","NDVI","kWh/hab"],
  fmt:[fs,f1,fi,f1,f2,fi],
  lim:{1:[1,1e5],2:[1,1e6],3:[12,34],4:[.1,.95]},
  make:p=>{const v=[p.n,p.pop*(.96+R()*.08),p.pop*(2.5+R()*1.6),14+R()*16,.25+R()*.65,0];SPEC_ANT.calc(v);return v},
  calc:v=>{v[5]=v[2]/v[1]*480}
};
const SPEC_COL={
  cols:["Ciudad","PIB idx","Dem. MW","Humed. %","Alertas","Score"],
  fmt:[fs,f1,f1,f1,fi,f1],
  lim:{1:[10,300],2:[1,5000],3:[20,100],4:[0,12]},int:[4],
  make:p=>{const v=[p.n,60+R()*80,p.pop/10*(.9+R()*.4),40+R()*55,Math.floor(R()*9),0];SPEC_COL.calc(v);return v},
  calc:v=>{v[5]=Math.max(0,v[1]*.5+v[2]*.05-v[4]*3+(v[3]-60)*.2)}
};
class Sheet{
  constructor(root,spec,pts,map){
    this.root=root;this.spec=spec;this.pts=pts;this.map=map;this.rows=[];this.off=0;this.nid=0;this.sel=null;this.fn=0;this.cnt=0;this.total=0;
    this.fbar=root.querySelector('.fbar');this.vp=root.querySelector('.vp');this.inner=root.querySelector('.inner');this.stat=root.querySelector('.stat');
    root.querySelector('.cols').innerHTML='<span class="rn"></span>'+spec.cols.map((n,i)=>`<span class="c${i}${i?' n':''}"><i>${String.fromCharCode(65+i)}</i>${n}</span>`).join('');
    setInterval(()=>this.mutate(),Math.max(30,110/CFG.rate));
    setInterval(()=>this.formula(),1500/CFG.rate);
    setInterval(()=>{this.stat.textContent=`⚙ ${this.cnt.toLocaleString('es-CO')} celdas/s  ·  ${this.total.toLocaleString('es-CO')} cálculos`;this.cnt=0},1000);
  }
  addRow(){
    const p=this.pts[Math.floor(R()*this.pts.length)],v=this.spec.make(p),el=document.createElement('div');
    el.className='row';const r={id:this.nid++,p,v,el};
    el.innerHTML=`<span class="rn">${r.id+2}</span>`+v.map((x,i)=>`<span class="c${i}${i?' n':''}">${this.spec.fmt[i](x)}</span>`).join('');
    this.cnt+=6;this.total+=6;this.rows.push(r);this.inner.appendChild(el);
  }
  mutate(){
    const r=this.rows[Math.floor(R()*this.rows.length)];if(!r)return;
    const s=this.spec,c=1+Math.floor(R()*4),[lo,hi]=s.lim[c];
    r.v[c]=(s.int&&s.int.includes(c))?Math.round(r.v[c]+(R()<.5?-1:1)):r.v[c]*(1+(R()-.5)*.12);
    r.v[c]=Math.min(hi,Math.max(lo,r.v[c]));s.calc(r.v);
    for(const k of [c,5]){const el=r.el.children[k+1];el.textContent=s.fmt[k](r.v[k]);el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl')}
    this.cnt+=2;this.total+=2;
  }
  formula(){
    const vis=Math.ceil(this.vp.clientHeight/ROWH),rs=this.rows.slice(0,Math.max(1,vis));if(!rs.length)return;
    const c=1+(this.fn%5),f=['SUMA','PROMEDIO','MAX','MIN'][Math.floor(this.fn/5)%4];this.fn++;
    const xs=rs.map(r=>r.v[c]);
    const res=f=='SUMA'?xs.reduce((a,b)=>a+b,0):f=='PROMEDIO'?xs.reduce((a,b)=>a+b,0)/xs.length:f=='MAX'?Math.max(...xs):Math.min(...xs);
    const L=String.fromCharCode(65+c);this.root.dataset.hl=c;
    this.fbar.innerHTML=`<b>fx</b> =${f}(${L}${rs[0].id+2}:${L}${rs[rs.length-1].id+2}) <em>→ ${this.spec.fmt[c](res)}</em>`;this.total++;
  }
  step(dt){
    const need=Math.ceil(this.vp.clientHeight/ROWH)+3;
    while(this.rows.length<need)this.addRow();
    this.off+=ROWH*0.0028*dt*CFG.speed;
    while(this.off>=ROWH){const r=this.rows.shift();r.el.remove();this.off-=ROWH;this.addRow()}
    this.inner.style.transform=`translateY(${-this.off}px)`;
    const s=this.rows[Math.floor((this.off+this.vp.clientHeight*.5)/ROWH)];
    if(s&&s!==this.sel){this.sel&&this.sel.el.classList.remove('sel');this.sel=s;s.el.classList.add('sel');this.map.pulse[s.p.n]=1}
  }
}

/* ---------- Montaje ---------- */
const pA=document.getElementById('pA'),pC=document.getElementById('pC');
const mapA=new MapView(document.getElementById('cA'),ANT_POLY,ANT_PTS,'79,216,255');
const mapC=new MapView(document.getElementById('cC'),COL_POLY,COL_PTS,'255,183,77',[{poly:ANT_POLY,rgb:'79,216,255',label:'ANTIOQUIA',lon:-75.6,lat:7.1}]);
const shA=new Sheet(document.getElementById('sA'),SPEC_ANT,ANT_PTS,mapA);
const shC=new Sheet(document.getElementById('sC'),SPEC_COL,COL_PTS,mapC);

/* ---------- Flujo de datos entre las dos pantallas ---------- */
const fx=document.getElementById('fx'),fc=fx.getContext('2d');
function fxResize(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fxResize);fxResize();
const TOK=["=SUMA()","12.4","A7","0x3F","▲","NDVI","∑","B12","3.14","=SI()","87%","C5:C20","kWh","μ","σ²","1011"];
let packets=[],tokens=[],lastPk=0;
const bez=(t,A,B,C)=>[(1-t)*(1-t)*A[0]+2*(1-t)*t*B[0]+t*t*C[0],(1-t)*(1-t)*A[1]+2*(1-t)*t*B[1]+t*t*C[1]];
function fxDraw(t,dt){
  fc.clearRect(0,0,innerWidth,innerHeight);
  if(!mapA.W||!mapC.W)return;
  const a=pA.getBoundingClientRect(),b=pC.getBoundingClientRect(),ra=mapA.cv.getBoundingClientRect(),rb=mapC.cv.getBoundingClientRect();
  const st=innerWidth<=900,m1=mapA.xy(-75.57,6.25),m2=mapC.xy(-75.57,6.25);
  const P0=[ra.left+m1[0],ra.top+m1[1]],P2=[rb.left+m2[0],rb.top+m2[1]];
  const P1=st?[Math.max(P0[0],P2[0])+110,(P0[1]+P2[1])/2]:[(P0[0]+P2[0])/2,Math.min(P0[1],P2[1])-130];
  // curva Medellín (Antioquia) ↔ Medellín en el mapa de Colombia
  const g=fc.createLinearGradient(P0[0],P0[1],P2[0],P2[1]);g.addColorStop(0,'rgba(79,216,255,.55)');g.addColorStop(1,'rgba(255,183,77,.55)');
  fc.save();fc.setLineDash([6,8]);fc.lineDashOffset=-t*.03;fc.strokeStyle=g;fc.lineWidth=1.4;
  fc.beginPath();fc.moveTo(P0[0],P0[1]);fc.quadraticCurveTo(P1[0],P1[1],P2[0],P2[1]);fc.stroke();fc.restore();
  // paquetes de datos
  if(t-lastPk>380/CFG.rate){lastPk=t;packets.push({t:0,v:.00035+R()*.0003,dir:R()<.7?1:-1})}
  packets=packets.filter(p=>{
    p.t+=p.v*dt*CFG.speed;
    if(p.t>=1){(p.dir>0?mapC:mapA).pulse['Medellín']=1;return false}
    for(let i=0;i<8;i++){
      const tt=Math.max(0,p.t-i*.012),q=bez(p.dir>0?tt:1-tt,P0,P1,P2),pc=p.dir>0?tt:1-tt;
      fc.fillStyle=`rgba(${79+176*pc|0},${216-33*pc|0},${255-178*pc|0},${(1-i/8)*.9})`;
      fc.beginPath();fc.arc(q[0],q[1],3.4-i*.3,0,7);fc.fill();
    }
    return true;
  });
  // fichas de cálculo cruzando el espacio entre pantallas
  if(R()<dt*.0045*CFG.rate&&tokens.length<80){
    const dir=R()<.7?1:-1;
    tokens.push(st?{t:0,dur:1400+R()*1600,dir,x:a.left+30+R()*(a.width-60),y0:a.bottom,y1:b.top,txt:TOK[Math.floor(R()*TOK.length)],v:1}
      :{t:0,dur:1400+R()*1600,dir,y:a.top+50+R()*(a.height-100),x0:a.right,x1:b.left,txt:TOK[Math.floor(R()*TOK.length)]});
  }
  fc.font='11px ui-monospace,Menlo,Consolas,monospace';
  tokens=tokens.filter(k=>{
    k.t+=dt;const p=k.t/k.dur;if(p>=1)return false;
    const pc=k.dir>0?p:1-p,al=Math.sin(Math.PI*p);
    const x=st?k.x:(k.x0+(k.x1-k.x0)*pc),y=st?(k.y0+(k.y1-k.y0)*pc):k.y;
    fc.fillStyle=`rgba(${79+176*pc|0},${216-33*pc|0},${255-178*pc|0},${al.toFixed(2)})`;fc.fillText(k.txt,x,y);
    return true;
  });
}

let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  shA.step(dt);shC.step(dt);mapA.draw(t);mapC.draw(t);fxDraw(t,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

<script>
/* ---------- Música electrónica generativa (Web Audio, sin archivos) ---------- */
(()=>{
const btn=document.getElementById('mus'),vol=document.getElementById('vol'),box=document.getElementById('audio');
const BPM=118,S16=60/BPM/4,ROOTS=[55,43.65,65.41,49],CH=[[0,3,7,12],[0,4,7,12],[0,4,7,12],[0,4,7,12]],SEQ=[0,2,1,3,2,1,3,2];
let ctx,master,delay,noiseBuf,timer,step=0,next=0,on=false;
const fr=(f,s)=>f*Math.pow(2,s/12);
function init(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master=ctx.createGain();master.gain.value=0;master.connect(comp);comp.connect(ctx.destination);
  delay=ctx.createDelay(1);delay.delayTime.value=S16*3;
  const fb=ctx.createGain();fb.gain.value=.38;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
  delay.connect(lp);lp.connect(fb);fb.connect(delay);lp.connect(master);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);
  document.body.dispatchEvent(new CustomEvent('beat'))}
function noise(t,dur,type,freq,v){const s=ctx.createBufferSource();s.buffer=noiseBuf;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ctx.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05)}
function bass(t,f,len){const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.Q.value=6;
  fl.frequency.setValueAtTime(900,t);fl.frequency.exponentialRampToValueAtTime(120,t+len);
  g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+len+.05)}
function pluck(t,f,acc){const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain(),s=ctx.createGain();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.Q.value=3;
  fl.frequency.setValueAtTime(3400,t);fl.frequency.exponentialRampToValueAtTime(500,t+.16);
  g.gain.setValueAtTime(acc?.16:.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);s.gain.value=.55;
  o.connect(fl);fl.connect(g);g.connect(master);g.connect(s);s.connect(delay);o.start(t);o.stop(t+.25)}
function pad(t,root,ch,len){ch.slice(0,3).forEach((n,i)=>{[-6,6].forEach(det=>{
  const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type='sawtooth';o.frequency.value=fr(root*4,n);o.detune.value=det;fl.type='lowpass';fl.frequency.value=900;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+len*.35);g.gain.linearRampToValueAtTime(.0001,t+len);
  o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+len+.05)})})}
function play(s,t){
  const bar=Math.floor(s/16)%4,b=s%16,r=ROOTS[bar],ch=CH[bar];
  if(b%4===0)kick(t);
  if(b===4||b===12)noise(t,.18,'bandpass',1800,.32);
  if(b%4===2)noise(t,.06,'highpass',8000,.22);else if(b%2===1)noise(t,.03,'highpass',9500,.06);
  if([2,6,10,14,7,15].includes(b))bass(t,r,S16*1.7);
  if(b%2===0||b%8===5)pluck(t,fr(r*4,ch[SEQ[b%8]]),b%4===0);
  if(b===0)pad(t,r,ch,S16*16);
}
function sched(){while(next<ctx.currentTime+.15){play(step,next);next+=S16;step=(step+1)%64}timer=setTimeout(sched,25)}
function setVol(){if(ctx)master.gain.setTargetAtTime(on?parseFloat(vol.value)*.7:0,ctx.currentTime,.05)}
btn.addEventListener('click',async()=>{
  if(!ctx)init();
  if(!on){await ctx.resume();on=true;step=0;next=ctx.currentTime+.08;sched();setVol();btn.textContent='♪ MÚSICA: ON';box.classList.add('on')}
  else{on=false;setVol();clearTimeout(timer);setTimeout(()=>{if(!on)ctx.suspend()},400);btn.textContent='♪ MÚSICA: OFF';box.classList.remove('on')}
});
vol.addEventListener('input',setVol);
})();
</script>
